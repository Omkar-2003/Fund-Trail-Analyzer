        const number_to_icon = {"1": {"icon": "\ud83d\udea9", "color": "#ff0000", "tooltip": "Zero transaction"}, "2": {"icon": "\ud83d\ude80", "color": "#00ff00", "tooltip": "Mismatch balance"}, "3": {"icon": "\u2b50", "color": "#0000ff", "tooltip": "Redundant utr"}, "4": {"icon": "\ud83c\udf1f", "color": "#ffff00", "tooltip": "missing utr"}, "5": {"icon": "\ud83d\udca1", "color": "#ff00ff", "tooltip": "Transaction id 0"}, "6": {"icon": "\ud83c\udf88", "color": "#00ffff", "tooltip": "missing date"}, "7": {"icon": "\ud83d\udd36", "color": "#ffa500", "tooltip": "Negative balance"}, "8": {"icon": "\ud83c\udfaf", "color": "#800080", "tooltip": "suspicious Deposit"}};

        // Function to create the data visualization
        function createDataVisualization(data) {
            const container = document.getElementById("data-viz");

            // Create a table element
            const table = document.createElement("table");

            // Create table header
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            const headerLabels = ["Index", "Serial No", "DATE", "TRANSACTION DETAILS", "CHQ.NO./ Ref No.", "VALUE DATE", "WITHDRAWAL AMT", "DEPOSIT AMT", "BALANCE AMT", "Label", "Flag"];
            headerLabels.forEach(label => {
                const th = document.createElement("th");
                th.textContent = label;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Create table body
            const tbody = document.createElement("tbody");

            // Bind data to table rows
            data.forEach(rowData => {
                const row = document.createElement("tr");

                // Add other columns
                headerLabels.forEach(key => {
                    const cell = document.createElement("td");
                    if (key === 'Index') {
                        const indexValue = rowData[key];
                        cell.textContent = indexValue;
                    } else if (key === 'Label') {
                        const labelValue = rowData[key];
                        cell.textContent = labelValue;
                    } else if (key === 'Flag') {
                        const flagIconData = number_to_icon.hasOwnProperty(rowData['Label']) ? number_to_icon[rowData['Label']] : null;
                        if (flagIconData) {
                            const flagIcon = document.createElement("span");
                            flagIcon.className = "flag-icon";
                            flagIcon.textContent = flagIconData['icon'];
                            flagIcon.setAttribute("title", flagIconData['tooltip']);  // Set the tooltip using the 'title' attribute
                            flagIcon.style.backgroundColor = flagIconData['color'];
                            cell.appendChild(flagIcon);
                        }
                    } else {
                        cell.textContent = rowData[key];
                    }
                    row.appendChild(cell);
                });

                // Apply styling to rows based on condition (Label > 0)
                const labelValue = rowData['Label'];
                if (labelValue > 0) {
                    row.classList.add("highlighted-row");
                }

                // Add the row to the table body
                tbody.appendChild(row);
            });

            // Add the table body to the table
            table.appendChild(tbody);

            // Add the table to the container
            container.appendChild(table);
        }

        // Call the function with the provided data
        createDataVisualization(data);
